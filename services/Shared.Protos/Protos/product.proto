syntax = "proto3";

option csharp_namespace = "Shared.Protos.Product";

import "Protos/common.proto";

package product;

// Request to create a category
message CreateCategoryRequest {
    string name = 1;
    string description = 2;
}

// Response from category creation
message CreateCategoryResponse {
    string id = 1;
    string name = 2;
    string description = 3;
    bool success = 4;
    string message = 5;
}

// Request to get all categories
message GetCategoriesRequest {
}

// Category details
message CategoryDto {
    string id = 1;
    string name = 2;
    string description = 3;
}

// Response containing list of categories
message GetCategoriesResponse {
    repeated CategoryDto categories = 1;
    bool success = 2;
    string message = 3;
}

message ProductVariantMessage {
  string name = 1;
  double price = 2;
  int32 stock = 3;
  string sku = 4;
}

message ProductImageMessage {
  string imageFileId = 1;
  string url = 2;
  string altText = 3;
  bool isPrimary = 4;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double basePrice = 3;
  string categoryId = 4;
  repeated ProductVariantMessage variants = 5;
  repeated ProductImageMessage images = 6;
}

message ProductResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  double basePrice = 4;
  string categoryId = 5;
}

message SearchProductsRequest {
    string query = 1;
    int32 page = 2;
    int32 pageSize = 3;
}

message SearchProductsResponse {
    repeated ProductResponse products = 1;
    int64 totalCount = 2;
}

// The Product Service definition
service ProductService {
    rpc CreateCategory (CreateCategoryRequest) returns (CreateCategoryResponse);

    rpc GetCategories (GetCategoriesRequest) returns (GetCategoriesResponse);

    rpc CreateProduct (CreateProductRequest) returns (ProductResponse);

    rpc SearchProducts (SearchProductsRequest) returns (SearchProductsResponse);
}
